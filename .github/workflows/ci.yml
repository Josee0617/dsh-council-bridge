name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm peers check
      - run: git diff --exit-code

  supported-dsh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:host

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, supported-dsh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --global pnpm@11.7.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack and publish the plugin asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json")).version; if (`v${version}` !== process.env.RELEASE_TAG) throw new Error("Tag must match package version")'
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum *.tgz > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.tgz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" *.tgz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "Council Bridge $RELEASE_TAG" --notes "Council Bridge for DeepSeek Harness Desktop 0.2.0-rc.2. Download the .tgz asset and install it through Plugins → Add plugin."
          fi
